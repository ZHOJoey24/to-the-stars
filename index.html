<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TO THE STARS</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
    font-family: Consolas, "Courier New", monospace;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* 像素风关键：关闭浏览器插值，否则放大后像素会糊 */
  #cv { display: block; background: #06070d; image-rendering: pixelated; image-rendering: crisp-edges; }
  /* 注意：#hud 已在美术阶段删除 —— 游戏内 HUD 全部由画布像素字绘制（drawHudPixels）；
     曾经同时存在 DOM HUD 与画布 HUD，两套文字会叠在一起，是已修复过的 bug。*/
  /* 状态覆盖层（开始 / 暂停 / 结算）：
     ============================ 这里出过一个严重 bug ============================
     上一版字号写成 calc(0.177 * max(100vw, 177.78vh))，意图是「17px × cover 缩放系数」，
     但 max(100vw, 177.78vh) 在 1077×593 窗口里 = max(1077, 1054) = **1077px**，
     于是字号 = 0.177 × 1077 变成 **190px** —— 整个开始界面只剩几个巨大的中文字。
     错在哪：我把「系数」写成了「视口长度」。要表达 17px × max(w/960, h/540)，
     正确写法 CSS 里是 max(1.771vw, 3.148vh)（两个 vw/vh 项各带自己的系数）。
     教训：这类算式**不要靠肉眼读代码判断**，离线 Canvas 桩也照不出来（它不渲染 DOM）。
     现在的做法是双保险：
       ① 这里在 CSS 只给一个**恒为正、绝不会失控**的兜底值（vmax 写法）；
       ② resize() 里用 JS 按真实尺寸写入精确像素值（--ov-fs / --ov-big-fs）。
     JS 一定比 calc 可靠，而且有真实视口尺寸可用，不需要在 CSS 里做视口数学。
     另外 max-width 也改成按「可见宽度」算：cover 最坏可能只剩 607.5 逻辑像素，
     overlay 是 700 逻辑像素 × scale，横向最多两侧各溢出 46 逻辑像素，
     靠 padding 与留白吸收 —— 不会切到正文。*/
  #overlay {
    position: fixed; pointer-events: none;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    text-align: center;
    color: #fff; text-shadow: 0 0 3px #000;
    /* 兜底：即使 JS 没跑到，也只是「略小」，绝不会变成巨型字。
       vmax 只用于兜底 —— 真正的字号由 resize() 写成精确像素值。*/
    font-size: 17px;
    /* 真正的字号由 resize() 写进 --fs / --big-fs。变量挂在 #overlay 自己身上，
       而 renderUI() 只重建它的**子节点**，所以变量不会被冲掉。
       下面这行只是 JS 没跑到时的兜底。 */
    font-size: var(--fs, min(4vmax, 34px));
    line-height: 1.8;
    max-width: 720px;
    overflow-wrap: break-word;
    background: rgba(0,0,0,.62); padding: 18px 26px;
    white-space: pre-line;
  }
  #overlay.hidden { display: none; }
  #overlay .big { font-size: 22px; font-size: var(--big-fs, min(5.2vmax, 44px)); color: #ffd45a; }
  /* 遥测面板：与游戏区分离，开启后暂停游戏，仅用于看数据与导出 */
  #tel {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,.93); color: #d8d8d8;
    font-family: Consolas, "Courier New", monospace; font-size: 13px;
    padding: 16px 20px; overflow: auto; display: none;
  }
  #tel.open { display: block; }
  #tel h3 { margin: 0 0 6px; font-size: 15px; color: #fff; }
  #tel table { border-collapse: collapse; margin-bottom: 12px; }
  #tel th, #tel td { border: 1px solid #444; padding: 2px 7px; text-align: right; white-space: nowrap; }
  #tel th { background: #1e1e1e; color: #9cd; }
  #tel td.l, #tel th.l { text-align: left; }
  #tel .ok { color: #7d7; }
  #tel .warn { color: #fd7; }
  #tel .bad { color: #f88; }
  #tel .hint { color: #888; }
  #tel .bar { display: flex; gap: 8px; margin-bottom: 12px; }
  #tel button {
    font-family: inherit; font-size: 13px; padding: 4px 12px; cursor: pointer;
    background: #222; color: #ddd; border: 1px solid #666;
  }
  #tel button:hover { background: #333; }
  #tel pre {
    background: #111; border: 1px solid #333; padding: 8px;
    max-height: 190px; overflow: auto; font-size: 11px; color: #9a9a9a;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="overlay"></div>
<div id="tel"></div>

<script>
"use strict";

/* =========================================================================
   TO THE STARS —— 单文件像素风悬停跑酷（双击即玩）
   事实来源就是这个文件；设计推导与踩坑记录见 游戏设计方案_V3.md 与 AGENTS.md。
   美术全部程序化绘制（ASCII 像素精灵 + 算法生成天体/星云），音效走 Web Audio 合成，
   零外部素材、零依赖 —— 这是《游戏编写要求》A2/A3 的硬约束，不要引入任何文件。
   ========================================================================= */

/* ------------------------------ 常量配置 ------------------------------ */
const CFG = {
  W: 960, H: 540,               // 逻辑分辨率 16:9

  /* 物理（第十一轮反馈：重力过大、悬停时上下振幅过大）
     **悬停振幅 = 单次跳跃顶点 apex** —— 这是恒等关系，不是近似：
       按最优节奏点按时角色在 [悬停高度, 悬停高度 + apex] 之间往复，所以 apex 就是振幅。
       旧值 apex = 80 → 振幅占起始区间（270）的 30%；中期区间收窄到 150 时占比过半，
       这就是"中期很容易死亡"的直接来源。
     本轮按"滞空 0.75 秒 + 顶点 40"联立反解：
       滞空 = 2·V0/G = 0.75  ⇒  V0 = 0.375·G
       顶点 = V0²/(2G) = 40  ⇒  V0 = √(80G)
       联立得 0.140625·G² = 80G ⇒ G = 569、V0 = 213
     结果：振幅 40（占屏高 7.4%，比旧值降低 50%），滞空 0.75 秒（旧 0.566 秒）。 */
  G: 569,
  V0: 213,

  /* 开局高度与开局初速
     · START_Y 决定可达上限 R = START_Y + apex，而起始区间有硬约束 gapHi ≤ R − 2·PH。
       要让"振幅小(apex=40) + 起始区间大(240)"同时成立，必须把 START_Y 抬到 300 左右：
       R = 340，则 gapHi ≤ 340 − 32 = 308，取 240 留足余量。
     · START_V **必须小于 V0**：若用 START_V = V0，开局那一次跳跃会从 300 冲到 340，
       再落到 300，幅度过大且贴到可行带上沿。改为刚好升到悬停舒适带中部的速度：
       START_V = 400 时顶点 = 300 + 400²/(2×569) = 300 + 141 = 441，
       而起始区间的上沿是 300 + 240 = 540 的一半左右，落在带内。
     注：这条打破了之前"START_V == V0 保证零漂移"的设定 —— 现在开局会先下沉一小段再进入
     稳定节奏，属于可接受的代价（换来的是开局不冲顶）。 */
  START_Y: 300,
  START_V: 400,

  /* 角色体积（第三次要求更小）：碰撞盒与绘制尺寸严格一致，占屏高 3.3% */
  PW: 16, PH: 16,
  DRAW_W: 16, DRAW_H: 16,
  PLAYER_X: Math.round(960 * 0.28),

  /* 输入 */
  DEBOUNCE: 0.08,               // 去抖，仅过滤意外双击
  RESTART_LOCK: 0.6,            // 结算输入锁定期

  /* 世界速度：**不再是难度主轴**（仅提供背景推进感）
     第十轮改判：速度改为**按距离**爬升（见 currentSpeed()），因为反馈要求
     "300m 达到难度上限" —— 只有把速度也挂在距离上，"难度达峰"与"速度达峰"
     才会同时发生在 300m；否则时间轴上的速度爬升会在达峰后继续把后半程推快。
     参数含义随之变为：SPD0 起步速度、SPD1 上限速度、
     **SPD_RAMP 的单位从"秒"变成"米"**（= 300，见下方 DIFF_RAMP 的说明）。 */
  SPD0: 180, SPD1: 340, SPD_RAMP: 300,

  /* 难度爬升：缝隙、位置扫掠、组间距都按这个 k 同步收紧
     ============================ 第十轮的核心改动 ============================
     第九轮反馈："200m 之后难度已经很难（这个难度应该设为上限），
     调整难度曲线使得游玩时间能提升。"
     第十轮反馈："① 难度上限的可通过窗口最小比例下调至屏幕的 13%；
     ② 要求在 300m 达到难度上限；③ 间隔密度基本没感受到随难度变化；
     ④ 可通过区域基本都在屏幕下三分之二，上三分之一从没出现过。"

     为什么把 k 从"时间线性"改成"**距离幂曲线**"：
       反馈 ② 要求 300m 达峰。若只把时间轴上的 DIFF_RAMP 从 176 压到 182 秒，
       那么难度会变成"前 100m 就冲到 0.55"—— 因为距离对时间是二次的
       （dist ≈ 180t + 0.42t²），时间线性映射到距离上就是"先慢后快"再被截断，
       前期陡、后期平，与"平滑爬到 300m"正相反。
       改成"按距离取幂"后：k = (d / 300)^0.7 ——
         50m → 0.26   100m → 0.42   200m → 0.68   300m → 1.00
       前期爬得比旧曲线还缓，300m 处干净利落地达峰。

     达峰后的一切都被冻结：k=1 时 gapH / gapT / sweep / speed 全部到顶，
     391m 与 3000m 面对的玩法参数完全相同 —— 玩家能走多远只取决于自己。 */
  DIFF_RAMP: 300,               // **单位：米**（不是秒）。达峰距离。
  DIFF_POW: 0.7,                // k = (d / DIFF_RAMP)^DIFF_POW，幂次 < 1 让前期更缓

  /* 摆动幅度：难度越高，缝隙位置摆得越远（**当前无引用**：位置摆幅由扫掠区间
     [sLo2, sHi2] 自然决定，AMP0/AMP1 是更早一版架构的遗留，见 AGENTS §9 #2） */
  AMP0: 0.45, AMP1: 1.0,

  /* 可通过区间（第七轮的核心：区间是主角，障碍由区间反推）
     GAP_HI → GAP_LO 是**唯一**的难度主轴：区间高度 270（屏高 50%）→ **70（屏高 13.0%）**

     下限 70 的来历（第十轮反馈 ①："最小比例下调至屏幕的 13%"）：
       · 13% × 540 = 70.2 → 取 70；
       · 70 = 4.4 个身位、1.75 个跳跃振幅（apex 39.9）。对比历史值：
         30（1.9 身位 / 0.75 振幅，当时是死局）、107（6.7 身位 / 2.7 振幅，被反馈"偏松"）；
       · 70 落在__solvable_check.js 扫出的悬崖之上：cap=30 死、cap=50 起自动机存活，
         所以它属于"能过但不宽裕"的档位。**改这个值必须重跑 __solvable_check.js**。

     为什么"能过"与"好过"是两件事：悬停时角色本来就在 apex ≈ 40 的带里往复，
     区间高度必须显著大于这个振幅才有容错。70 / 40 = 1.75 倍，属于刻意收紧。

     （历史上还有一个 POS_RANGE 位置摆幅系数，第 15 轮已删除：它把低难度的位置摆幅
       压到理论范围的 45%，是"区间总落在下半屏"的机制之一 —— 现在位置由模式机直接控制，
       见下面 MOVE_* / JUMP_* / DENS_* 那一段。） */
  GAP_HI: 270, GAP_LO: 70,
  STEP_MAX: 40,                        // ⚠️ 第 15 轮起**生成器不再使用**（位置改由
                                       // "模式机 + 预算反推"控制，见 generateObstacle 第 3 步）——
                                       // 保留是因为 __rand_check.js 的"理论上限"一行还在引用，
                                       // **不要以为调它能改变位置幅度**。
  SWEEP0: 0.5, SWEEP1: 1.0,            // ⚠️ 同上，已不再被生成器引用

  /* 单独障碍的参数已废弃 —— 第七轮起形态由"区间位置"自然决定，
     不再需要单独的柱高/板底区间。以下两项保留给 PHYS 计算用。 */
  WIN_JITTER: 10,               // 区间中心的随机抖动
  GAP_MIN_PX: 70,               // 区间高度硬下限（必须 == GAP_LO，否则会把难度上限夹回去）
  START_FLAT: 3,                // 开局前几个障碍保持最低难度
  GAP_JIT: 0.06,                // 缝高的每组抖动（±6%）：难度曲线不变，但读起来不再等宽

  /* ---- 位置「模式机」与密度「呼吸」（第 15 轮） ----
     ============================ 第 15 轮的核心修正 ============================
     反馈原话："可通过区域还是很规律的上下浮动，柱子的密度间距也是十分均匀。
                没有任何的突变下坠和上升，游玩比较单调和可预测。"

     ★ 第 11 轮的随机化只做到"小步 + 偶尔反向"（单步 12~54、翻转 18%），
       那在统计上确实"随机"，但对玩家来说**局部永远是平滑的**：
       相邻两组的落差只有 0.1~0.3 个缝高，看不到任何"事件"。
       **随机 ≠ 有起伏** —— 这是本轮最重要的一句。

     所以把位置拆成三种模式，而且**幅度由本组的真实时间预算反推**（物理上必然做得到）：

       hold   原地停留  24%  —— 制造喘息，让突变有对比（全是突变等于没有突变）
       drift  小步跟进  42%  —— 连续性的底噪，幅度 = 0.35~0.75 × 本组能爬的高度
       jump   突变      34%  —— 幅度按**缝高**给：向上 0.9~1.8 倍、向下 1.5~3.2 倍，
                                再用预算上限夹住；并且**成串**（同向 2~4 组），
                                玩家体验到的才是"一路俯冲"而不是原地抖动。

     ★ 上/下不对称是有物理依据的，不是为了好看：
         上升只能靠反复点按 ⇒ 净速率 apex/滞空 ≈ 53.3 单位/秒 ⇒ 1.3s 预算只够 ~55 单位；
         下降是自由落体      ⇒ √(2Δ/G)              ⇒ 同样预算能掉 ~150 单位。
       于是"俯冲可以很猛、拉起来必须给足组数"——这正是玩家要的"突变下坠"的物理来源。

     ★ 密度同理：间距不再是常数，而是 burst / normal / rest 三种"呼吸"
       （连紧 2~3 组 → 送一个长间隔），玩家感到的是"一阵紧、一口气"，而不是均匀排队。 */
  MOVE_HOLD_P: 0.24, MOVE_JUMP_P: 0.34,   // 停留 / 突变 的概率（其余为 drift）
  DRIFT_LO: 0.35, DRIFT_HI: 0.75,         // drift 幅度 = 该系数 × 本组能爬的高度
  JUMP_UP_LO: 0.9, JUMP_UP_HI: 1.8,       // 上突变幅度 = 该系数 × 缝高（再被预算夹住）
  JUMP_DN_LO: 1.5, JUMP_DN_HI: 3.2,       // 下突变幅度 = 该系数 × 缝高（再被预算夹住）
  DIVE_MAX: 200,                          // 单次俯冲的绝对上限（像素）
  SAFE_CLIMB: 0.85, SAFE_FALL: 0.55,      // 预算安全系数：只用到预算的这一部分
  TREND_P: 0.55, TREND_RUN: 3,            // 突变成串的概率 / 最长段
  DENS_BURST: 0.80, DENS_REST: 1.45, DENS_JIT: 0.10,   // 密度呼吸的极端系数与普通抖动
  /* ★ 呼吸必须**均值守恒**：burst 的组数占比（0.30×2.5 = 0.75）比 rest（0.25×2.5 = 0.625）
     更大，所以"紧 20% / 松 45%"平均下来是**净变松 +6.8%** —— 那就是偷偷改难度（实测均值
     从 440 涨到 470）。这个系数把它拉回来，`__rand_check.js` 会断言"均值因子 ≈ 1.00"。 */
  DENS_FIX: 0.936,

  /* 组间距：**密度必须同时收紧"时间"与"像素"两个维度**
     ============================ 第十轮的核心修正 ============================
     第十轮反馈 ③："障碍物的间隔密度距离在游玩时基本没有感受到随难度变化。"

     这不是感觉问题，是**公式问题**。间距的取值是
         spacing = max(speed × gapTime, pxFloor)
     而速度从 180 涨到 340（×1.63）、时间间距从 2.4s 收到 1.3s（×0.54），
     两者**几乎完全抵消**：实测像素间距 515px → 538px（不降反升）。
     玩起来就是"障碍变远了"而不是"越来越密"。

     ★ 关键认知（第十轮实测出来的，别再绕）：
        `max()` 里的下限只能**抬高**间距、不能压低它。
        所以"像素下限"若低于速度项，它就等于没写；旧值 320 就是这样失效的。
        要让密度随难度上升，下限必须**全程高于速度项**，并且自己随难度递减。
        我一度把下限降到 220 想"让密度收紧"，结果速度项（459~583）完全接管，
        间距反而从 523px 涨到 589px —— 方向搞反了。

     最终标定：pxFloor 从 440 收到 320，且全程 ≥ 速度项（180×2.4 = 432 ~ 340×1.3 = 442）
        k=0  max(432, 440) = **440px**  → 屏内约 2.2 组
        k=1  max(442, 320) = **442px** … 仍由速度项接管，只比前段宽 0.5%
     也就是说：像素间距基本被"钉"在 440 附近，**"越来越密"必须靠时间维度表达** ——
     组与组的**相遇频率**（= speed / spacing）反而真在上升：0.41 → 0.77 组/秒（+88%），
     加上速度本身 ×1.63（屏幕滚动更快、障碍掠过更快），
     合起来才是玩家能感知的"密度在涨"。`GAP_PX_MIN` 是硬地板护栏，正常不触发。 */
  GAP0: 2.4, GAP1: 1.3, GAP_MIN: 1.3,
  GAP_PX0: 440, GAP_PX1: 320,   // 像素间距下限：随难度 440 → 320（全程高于速度项，因此真正生效）
  GAP_PX_MIN: 250,              // 硬地板：任何情况下两组不得比这更近（护栏，正常不触发）
  REACT: 0.35,

  /* 生成前置量 */
  LEAD_MIN: 120,                // 前瞻距离下限（像素）
  LEAD_TIME: 0.5,               // 额外预留的观察时间

  OW_MIN: 45, OW_MAX: 110,      // 障碍物宽度
  SPAWN_MARGIN: 40,             // 生成点在屏幕右侧之外的距离
  FIRST_DELAY: 620,             // 首个障碍物额外延迟

  /* 计分 */
  PX_PER_M: 100,

  /* 像素放大倍数：精灵每个像素放大为 PIXEL 个逻辑单位。
     2 表示飞船在屏幕上占 32×32 逻辑像素（视觉），而碰撞盒仍是 16×16。
     **注意：DRAW_W/DRAW_H 必须继续等于 PW/PH**，否则"视觉 == 碰撞"这条铁律会破，
     玩家会重现早期"看着撞到了却没死"的问题。 */
  PIXEL: 3,

  DT: 1 / 120,                  // 固定物理步长（帧率无关）
  MAX_FRAME: 0.25,              // 单帧时间截断（防切标签页后瞬移）

  /* HUD 安全区（单位：逻辑像素，从画布左右边缘内缩）
     画布用 cover 方式铺满窗口，横向会被裁掉一部分：
       scale = max(winW/960, winH/540)，可见宽度 = winW/scale ≤ 960
     最坏情况是竖屏或窄窗口（winW/winH = 0.5625）
       → scale = 540/winH，可见宽度 = 0.5625 × 2 × 540 = 607.5（只裁掉两侧各 176）
     而 1920×1080 时可见宽度已经是满 960。
     所以任何贴边的 HUD（原来难度条右边缘在 x=946）在窄窗口下都会被裁掉，
     必须把 HUD 全部限制在这个安全区内 —— 这是"难度条被右边缘切掉"的根因。 */
  HUD_SAFE: 280,
  HUD_PAD: 18,                  // 安全区内再留一点呼吸

  REASONS: {
    ceiling:  "跳太高，撞到顶部了",
    obstacle: "撞上障碍物了",
    floor:    "掉得太低，触底了"
  }
};

/* 由物理参数派生的关键高度（避免出现手写常数与公式不一致） */
const PHYS = {
  APEX: CFG.V0 * CFG.V0 / (2 * CFG.G),          // 单次抛物线顶点
  AIR: 2 * CFG.V0 / CFG.G,                      // 单次滞空
  HOVER: 0,                                     // READY 悬停高度 = 开局高度（不再是顶点）
  PILLAR_CEIL: 0,                               // 柱顶硬上限 = 顶点 − 角色高
  MAX_PLAYER_TOP: 0                             // 在开局高度起跳能到达的最高 py
};
PHYS.HOVER = CFG.START_Y;
PHYS.PILLAR_CEIL = PHYS.APEX - CFG.PH;
PHYS.MAX_PLAYER_TOP = CFG.START_Y + PHYS.APEX;

/** 天花板块下边缘的硬性上限：
    若高于"玩家从开局高度起跳能到达的最高点 + 角色高"，玩家不动也能飞过去，
    这种障碍没有任何约束意义。生成器必须按此夹取。 */
PHYS.CEIL_CAP_MAX = PHYS.MAX_PLAYER_TOP - 1;

/* ===== 两种独立障碍的合法区间（这是本轮简化的核心）=====
   早期把柱与板绑成"闸门"共享一个窗口定义，产生了四个互相耦合的约束
   （柱高上限 / 板底下限 / 窗口下界 / 可达高度），我反复配平都漏项，
   最终让生成器彻底失效。现在退回为**两个完全独立的障碍**：
     地面柱：只有一条约束 —— 玩家从最低可能位置起跳也能越过
     悬顶块：只有一条约束 —— 玩家即使跳到最高也还在它下方（必须下落才能通过）
   两者不共享任何变量，因此不会互相挤压。 */
PHYS.LOWEST_Y = 0;                       // 玩家可能处于的最低高度
PHYS.PT_HI = 0;                          // 柱顶硬上限（跳得过去）
PHYS.PB_LO = 0;                          // 板底硬下限（容得下、玩家能到它下面）
PHYS.PB_HI = 0;                          // 板底硬上限（真的挡得住玩家）

/* 玩家可能的最低位置：
   · 开局时就是起始高度；
   · 之后他可能一路下坠到接近地面（触底即死，所以最低留一个身位）。
   柱顶必须让玩家从**这个最低位置**起跳也能越过，否则他低位时必死。 */
PHYS.LOWEST_Y = CFG.PH + 2;                                   // 玩家可能的最低位置
/* 柱顶硬上限：越过柱顶需要 py ≥ pt + PH，而玩家从最低位置起跳能到达 LOWEST_Y + apex，
   故 pt + PH ≤ LOWEST_Y + apex − 余量。 */
PHYS.PT_HI = Math.max(10, PHYS.LOWEST_Y + PHYS.APEX - CFG.PH - 8);
/* 板底硬下限：必须能容下一个身位，且玩家能到达它下方 */
PHYS.PB_LO = CFG.PH * 2 + 30;
/* 板底硬上限：必须低于"玩家可达最高点 + 一个身位"，否则玩家站在最高处也撞不到它，
   板子形同虚设。留 4 单位余量避免刚好擦边。 */
PHYS.PB_HI = Math.max(PHYS.PB_LO + 20, PHYS.MAX_PLAYER_TOP - 4);

/* ===== 成对障碍（上下夹逼）的硬约束 =====
   成对障碍 = 同一水平位置上的地面柱 + 悬顶块，两者之间形成窄缝。
   玩家要穿过必须同时满足：
     ① py ≥ 柱顶 + PH          （脚在柱子上方）
     ② py ≤ 板底 − PH          （头在板子下方）
     ⇒ 缝隙宽度 = 板底 − 柱顶 − 2·PH ≥ GAP
     ⇒ 柱顶 ≤ 板底 − GAP − 2·PH          这是柱顶被板底反向限制的那条约束
   另一条独立约束：板底 ≤ 可达上限，否则玩家从上方飞过、板子形同虚设。
   这两条一起把"柱顶可用的高度范围"压缩得很窄 —— 这正是前几轮我卡住的地方。 */
PHYS.PAIR_PT_HI = 0;
PHYS.PAIR_PB_HI = 0;

/* 柱顶上限（反推障碍时用来夹取）：
   唯一要求是"玩家从最低位置起跳也能越过" ⇒ 柱顶 + PH ≤ START_Y + apex − 余量。
   注意不再需要"缝隙放得下"那条 —— 因为区间是先定的，障碍由区间反推，天然相容。 */
PHYS.PAIR_PT_HI = Math.max(0, PHYS.MAX_PLAYER_TOP - CFG.PH - 8);
/* 板底上限：必须 ≤ 可达上限，否则玩家从上方飞过去、板子形同虚设。
   留 4 单位余量，并要求板底比屏幕顶低 40（否则板子太薄、看不出是障碍） */
PHYS.PAIR_PB_HI = Math.min(CFG.H - 40, PHYS.MAX_PLAYER_TOP - 4);

   像素风的最小实现：把 ASCII 图解析成像素网格，绘制时逐格 fillRect。

   色号：. 透明  1 轮廓  2 主体  3 高光  4 座舱  5 尾焰 */

  "................",

/* 无尾焰版本：用于尾焰闪烁动画（两帧交替） */

/* 调色板（纯宇宙风）：深色轮廓 / 蓝色主体 / 青色高光 / 暖黄座舱 / 橙色尾焰 */
const SHIP_PAL = {

  "5": [255, 126, 60],
};

/** 把 ASCII 图解析为像素网格：grid[y][x] = [r,g,b] 或 null */
function makeSprite(map, pal) {
  const h = map.length, w = map[0].length;
  const grid = [];
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) row.push(pal[map[y][x]] || null);
    grid.push(row);
  }
  return { w, h, grid };
}

/** 绘制精灵：以 (px, py) 为左上角，每个像素放大为 CFG.PIXEL 个逻辑单位 */
function drawSprite(sp, px, py) {
  const S = CFG.PIXEL;
  for (let y = 0; y < sp.h; y++) {
    const gy = py + y * S;
    if (gy + S < 0 || gy > CFG.H) continue;
    for (let x = 0; x < sp.w; x++) {
      const c = sp.grid[y][x];
      if (!c) continue;
      const gx = px + x * S;
      if (gx + S < 0 || gx > CFG.W) continue;
      ctx.fillStyle = "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
      ctx.fillRect(gx, gy, S, S);
    }
  }
}

const SHIP = makeSprite(SHIP_MAP, SHIP_PAL);
const SHIP_NOFLAME = makeSprite(SHIP_MAP_NOFLAME, SHIP_PAL);

/** 用像素字体写字。scale 为像素放大倍数，px/py 是左上角（画布坐标） */
function drawText(str, px, py, scale, color, align) {
  const s = scale || 2;
  const chars = String(str).toUpperCase().split("");
  const cw = 6 * s;                                  // 5 宽 + 1 间距
  const total = chars.length * cw - s;
  let x0 = px;
  if (align === "right") x0 = px - total;
  else if (align === "center") x0 = px - Math.round(total / 2);
  ctx.fillStyle = color;
  for (let ci = 0; ci < chars.length; ci++) {
    const g = FONT5x7[chars[ci]] || FONT5x7[" "];
    for (let ry = 0; ry < 7; ry++) for (let rx = 0; rx < 5; rx++) {
      if (g[ry][rx] !== "1") continue;
      ctx.fillRect(x0 + ci * cw + rx * s, py + ry * s, s, s);
    }
  }
  return total;
}
function textWidth(str, scale) {
  const s = scale || 2;
  return String(str).length * 6 * s - s;
}

/* ------------------------------ 音效（程序化合成） ------------------------------
   不引入任何音频文件。AudioContext 必须懒初始化于首次用户交互之后
   （浏览器自动播放策略），初始化失败则静默降级为无声。 */
const Sfx = {
  ac: null, muted: false,
  init() {
    if (this.ac) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ac = new AC();
    } catch (e) { this.ac = null; }
  },
  /** 简单包络音：freq 起始频率、slide 结束频率、dur 时长秒、type 波形 */
  tone(freq, slide, dur, type, vol) {
    if (this.muted) return;
    this.init();
    if (!this.ac) return;
    try {
      const t = this.ac.currentTime;
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* 静默降级 */ }
  },
  jump()    { this.tone(420, 760, 0.10, "square", 0.07); },   // 上扬：有效跳跃
  invalid() { this.tone(150, 90, 0.10, "sawtooth", 0.05); },  // 低沉：早按无效（必须与跳跃明显区分）
  hit()     { this.tone(180, 40, 0.35, "sawtooth", 0.10); },  // 撞击
};

/* ------------------------------ 星空（三层视差） ------------------------------
   星星用确定性伪随机生成，存"世界坐标"，绘制时按视差系数滚动并取模循环。
   用确定性而不是 Math.random，是为了每局星图一致（视觉稳定，便于对比）。 */
const STARS = [];
(function buildStars() {
  const rnd = (function (seed) {                     // 线性同余，确定性
    let s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  })(20260915);
  const LAYERS = [
    { n: 120, par: 0.15, size: 1, col: [ 96, 116, 168], tw: 0.4 },  // 远景：暗、小、慢
    { n:  70, par: 0.42, size: 2, col: [150, 178, 232], tw: 0.7 },  // 中景
    { n:  36, par: 1.00, size: 2, col: [232, 244, 255], tw: 1.2 },  // 主景：亮、快
  ];
  for (const L of LAYERS) {
    for (let i = 0; i < L.n; i++) {
      STARS.push({
        x: rnd() * CFG.W, y: rnd() * CFG.H, par: L.par,
        size: L.size + (rnd() < 0.18 ? 1 : 0),
        col: L.col, tw: L.tw, ph: rnd() * Math.PI * 2,
      });
    }
  }
})();

/* ------------------------------ 粒子系统 ------------------------------ */
const PARTS = [];
function spawnParticle(x, y, vx, vy, life, col, size) {
  if (PARTS.length > 260) return;                    // 上限保护
  PARTS.push({ x, y, vx, vy, life, max: life, col, size: size || 2 });
}
/** 推进粒子。dt 与游戏状态无关，任何状态下都推进（避免暂停时粒子冻结得突兀） */
function updateParticles(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const p = PARTS[i];
    p.x += p.vx * dt;
    p.y -= p.vy * dt;                                // vy 以"向上为正"，画布是向下为正
    p.vy -= 260 * dt;                                // 一点重力
    p.life -= dt;
    if (p.life <= 0) PARTS.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of PARTS) {
    const k = p.life / p.max;
    // 随时间变暗（像素风：不做 alpha 混合，直接按比例压暗颜色）
    const r = Math.round(p.col[0] * k), g = Math.round(p.col[1] * k), b = Math.round(p.col[2] * k);
    ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
}


/* --------------------------- 工具函数 --------------------------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;

/** "#rrggbb" → [r,g,b]。像素风与程序化绘制里到处都要用，
    而这些地方一律是**手算混色**（不用 ctx.globalAlpha），
    因为离线渲染桩不认识 globalAlpha，手算才能保证"离线 == 浏览器"。 */
function hexToRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}

/** 平滑往复波（相位步长不再是 0.5，因此会连续扫过整个区间而不只取端点） */
function oscWave(s) {
  return 0.5 - 0.5 * Math.cos(2 * Math.PI * (((s % 1) + 1) % 1));
}

/** 从高度 h0 起跳，首次达到 h1 所需时间；h1 高于可达顶点则返回 Infinity */
function climbTime(h0, h1) {
  if (h1 <= h0) return 0;
  const disc = CFG.V0 * CFG.V0 - 2 * CFG.G * h0;
  if (disc <= 0) return Infinity;                        // 已在顶点，无法再升高
  const disc2 = CFG.V0 * CFG.V0 - 2 * CFG.G * h1;
  if (disc2 < 0) return Infinity;                        // 超过顶点，物理不可达
  if (disc2 === 0) return Math.sqrt(disc) / CFG.G;       // 目标恰为顶点（浮点可能正好落在 0）
  return (Math.sqrt(disc) - Math.sqrt(disc2)) / CFG.G;
}

/** 自由落体从 h0 降到 h1 的时间 */
function fallTime(h0, h1) {
  return h1 >= h0 ? 0 : Math.sqrt(2 * (h0 - h1) / CFG.G);
}

/** 从区间 [a0,a1] 内任一高度迁移到区间 [b0,b1] 内任一高度所需的最小时长 */
function migrateTime(a0, a1, b0, b1) {
  return Math.max(climbTime(a0, b1), fallTime(a1, b0));
}
